name: Assemble AI Threat Detection Workbook

on:
  pull_request:
    branches:
      - main
    paths:
      - '.workbook_chunks/**'
      - '.github/workflows/assemble-ai-threat-workbook.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Assemble and validate workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AI_Enabled_Threat_Detection_and_Hunting_Workbook

          cat > /tmp/chunk-sha256.txt <<'EOF'
          d48294a5512dc7c5e6987bd2324ce00a1d2347b69714e34d2b3e1d3becda4417  .workbook_chunks/part01.b64
          1e58304cbb7ac590385d57e8a987fe4c5be67aee6a7b832098c8e048cd548449  .workbook_chunks/part02.b64
          a32c7ac1b3f5a8ef8d3a9fc43f42569b5ee0a7294d2fb9f9570d87e55f62882a  .workbook_chunks/part03.b64
          6aae85d612705f9ff1d0452c51e2a746583d2b74c7ecd859ccf816490683415b  .workbook_chunks/part04.b64
          28ba9c720dfb6da1b395d57fa60d6b0c13c7fa8525519e1f2b3dfae31ac835c2  .workbook_chunks/part05.b64
          d1c5d0992fd63b004c5c676e5fea0fce48b1ac16b67f257ec98dfab9d46df0e7  .workbook_chunks/part05b.b64
          f2058a12fb462f5931ba5e2d9b49f33e80c8d2e81ec26c1f9f097a48a6ae24f3  .workbook_chunks/part05c.b64
          33b1b01c0d3fc68fb2160897900c82b554bcd982ad99024734213bec84ecf2aa  .workbook_chunks/part06.b64
          5ce9e4f600c21750c1788e8fefe6bcffb50ea808291d4ec476bab26e4e044c11  .workbook_chunks/part06b.b64
          7f25e3193d29e2518d661e80300477508d02813fcbbc53195e9c8b9578a1f96e  .workbook_chunks/part06c.b64
          7945b1e3e1aafac76b04193c1f712ec1c467d09a2b6f31be6587a64eef652e5d  .workbook_chunks/part06d.b64
          6a0882a7c35e22eaea9ae7961f8e9f822fd4aa02a434a0509212abf7a9e252c1  .workbook_chunks/part07.b64
          be92ac0c7c1e8e578ce3e2a52f0f1ff496d483309bbc8d4f1eea318a4c8bdf96  .workbook_chunks/part08.b64
          321b249762abc97dc4c066bacc57c598ec2ea38250582a2dbf2aabd37e1d8279  .workbook_chunks/part09.b64
          EOF
          sha256sum --check /tmp/chunk-sha256.txt

          tr -cd 'A-Za-z0-9+/=' < <(cat .workbook_chunks/part*.b64) > /tmp/workbook.b64
          test "$(wc -c < /tmp/workbook.b64)" -eq 45984
          base64 --decode /tmp/workbook.b64 > AI_Enabled_Threat_Detection_and_Hunting_Workbook/AI_Enabled_Threat_Detection_and_Hunting_Workbook_v1.0.xlsx
          echo "725ea591065e7f638c24df2eb820a2a4748e3676a6791f3fabdcedb4a6346c71  AI_Enabled_Threat_Detection_and_Hunting_Workbook/AI_Enabled_Threat_Detection_and_Hunting_Workbook_v1.0.xlsx" | sha256sum --check
          python - <<'PY'
          from zipfile import ZipFile
          path = 'AI_Enabled_Threat_Detection_and_Hunting_Workbook/AI_Enabled_Threat_Detection_and_Hunting_Workbook_v1.0.xlsx'
          with ZipFile(path) as workbook:
              required = {'[Content_Types].xml', 'xl/workbook.xml', 'xl/styles.xml'}
              missing = required.difference(workbook.namelist())
              if missing:
                  raise SystemExit(f'Missing required workbook components: {sorted(missing)}')
          PY
          rm -rf .workbook_chunks
          rm -f .github/workflows/assemble-ai-threat-workbook.yml

      - name: Commit assembled workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize AI-enabled threat detection workbook"
          git push origin "HEAD:${TARGET_BRANCH}"
